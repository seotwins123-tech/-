<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>서울 힐링 월드 (감정표현)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc8f0;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
canvas{display:block;touch-action:none}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.55);touch-action:none}
#knob{position:absolute;left:45px;top:45px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.8);pointer-events:none}
.b{position:fixed;border-radius:50%;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 3px #0008;touch-action:none}
.b.on{background:rgba(255,255,255,.65)}
#jump{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:84px;height:84px;font-size:16px}
#crouch{right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:13px}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000a;pointer-events:none;transition:opacity 1s}
#act{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(134px + env(safe-area-inset-bottom,0px));width:96px;height:48px;border-radius:24px;font-size:14px;display:none}
#sit{right:calc(130px + env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));width:84px;height:48px;border-radius:24px;font-size:14px;display:none}
#run{right:calc(196px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:13px}
#pb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:32px;height:54px;border-radius:9px;border:3px solid #1c1c1e;box-sizing:border-box;background:linear-gradient(160deg,#4b7bec,#a55eea);box-shadow:0 0 0 1px #aaa;touch-action:none}
#ph{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9}
#pf{width:min(290px,76vw);height:min(590px,86vh);background:#000;border-radius:46px;padding:10px;box-sizing:border-box;box-shadow:0 0 0 2px #4a4a4e,0 20px 60px #000a}
#sc{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:linear-gradient(160deg,#243b8a,#7d3fb5 55%,#e8718d);color:#fff}
#di{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:84px;height:24px;background:#000;border-radius:14px;z-index:2}
#sb{position:absolute;top:13px;left:0;right:0;padding:0 24px;display:flex;justify-content:space-between;font-size:12px;font-weight:600}
#pv{position:absolute;left:0;right:0;top:56px;bottom:100px;padding:0 16px;overflow:auto}
.ap{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;text-align:center;font-size:10px}
.ic{width:100%;aspect-ratio:1;max-width:50px;margin:0 auto 4px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px}
#dk{position:absolute;left:10px;right:10px;bottom:22px;height:62px;border-radius:26px;background:rgba(255,255,255,.25);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 8px}
#hb{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:100px;height:5px;border-radius:3px;background:#fff;padding:8px 0;background-clip:content-box}
.bt{display:block;width:100%;margin:8px 0;padding:11px;border:0;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:14px}
#bk{display:none}body.bike #bk{display:block}
#mp{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:118px;height:104px;border-radius:12px;border:2px solid rgba(255,255,255,.75);box-shadow:0 2px 8px #0006;z-index:5;touch-action:none;background:#333}
#mp.big{width:295px;height:260px}
#st{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(176px + env(safe-area-inset-top,0px));max-width:190px;padding:5px 9px;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font:12px/1.4 sans-serif;pointer-events:none;z-index:4}
#fl{left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(172px + env(safe-area-inset-bottom,0px));width:62px;height:46px;border-radius:23px;font-size:13px}
#ib{right:calc(10px + env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));width:42px;height:42px;font-size:20px}
.pn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,84vw);max-height:80vh;overflow:auto;padding:14px;border-radius:18px;background:rgba(22,24,30,.92);color:#fff;font-size:14px;display:none;z-index:8;box-shadow:0 10px 40px #000a}
.pn h3{margin:0 0 8px;font-size:16px;text-align:center}
#uw{position:fixed;inset:0;background:rgba(20,100,150,.42);pointer-events:none;display:none}
#mn{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,rgba(10,20,40,.55),rgba(10,20,40,.2));color:#fff;z-index:20;font-family:sans-serif}
.mt{font-size:34px;font-weight:700;text-shadow:0 2px 10px #0008}.ms{font-size:13px;opacity:.85;margin-bottom:14px}
